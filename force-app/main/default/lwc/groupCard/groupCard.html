<template>
  <template if:true={group}>
    <article class="group-card">
      <!-- Group Image -->
      <div class="group-image-container">
        <template if:true={group.bannerImage}>
          <img src={group.bannerImage} alt={group.name} class="group-banner" />
        </template>

        <template if:false={group.bannerImage}>
          <div class="group-banner group-banner-placeholder">
            <lightning-icon
              icon-name="utility:groups"
              size="medium"
              alternative-text="Group"
            >
            </lightning-icon>
          </div>
        </template>

        <!-- Logo -->
        <template if:true={group.logo}>
          <img src={group.logo} alt={group.name} class="group-logo" />
        </template>
      </div>

      <!-- Content -->
      <div class="group-content">
        <h2 class="group-name">{group.name}</h2>

        <template if:true={group.description}>
          <p class="group-description">{group.description}</p>
        </template>

        <!-- Location >
            <template if:true={location}>
                <div class="group-location">

                    <lightning-icon
                        icon-name="utility:location"
                        size="x-small"
                        alternative-text="Location">
                    </lightning-icon>

                    <span>{location}</span>

                </div>
            </template-->

        <!-- Member Count -->
        <div class="group-members">
          <lightning-icon
            icon-name="utility:groups"
            size="x-small"
            alternative-text="Members"
          >
          </lightning-icon>

          <span> {group.memberCount} Members </span>
        </div>

        <!-- Membership Status -->
        <div class="membership-status">
          <template if:true={isMember}>
            <span class="status status-member">
              <lightning-icon
                icon-name="utility:success"
                size="xx-small"
                alternative-text="Member"
              >
              </lightning-icon>
              Member
            </span>
          </template>

          <template if:true={isPending}>
            <span class="status status-pending">
              <lightning-icon
                icon-name="utility:clock"
                size="xx-small"
                alternative-text="Pending"
              >
              </lightning-icon>
              Request Pending
            </span>
          </template>

          <template if:true={isOnHold}>
            <span class="status status-hold">
              <lightning-icon
                icon-name="utility:pause"
                size="xx-small"
                alternative-text="On Hold"
              >
              </lightning-icon>
              Membership On Hold
            </span>
          </template>

          <template if:true={isRejected}>
            <span class="status status-rejected"> Request Rejected </span>
          </template>
        </div>

        <!-- Actions -->
        <div class="group-actions">
          <button class="secondary-button" onclick={handleViewDetails}>
            View Details
          </button>

          <template if:true={canJoin}>
            <button
              class="primary-button"
              onclick={handleJoin}
              disabled={isJoining}
            >
              <template if:true={isJoining}>
                <lightning-spinner alternative-text="Joining" size="small">
                </lightning-spinner>
              </template>

              <template if:false={isJoining}> Join Group </template>
            </button>
          </template>

          <template if:true={isMember}>
            <button
              class="destructive-button"
              onclick={handleLeave}
              disabled={isLeaving}
            >
              <template if:true={isLeaving}>
                <lightning-spinner alternative-text="Leaving" size="small">
                </lightning-spinner>
              </template>

              <template if:false={isLeaving}> Leave Group </template>
            </button>
          </template>
        </div>
      </div>
    </article>
  </template>
</template>
