<template>
  <div class="participated-rides-container">
    <!-- Section Header -->
    <div class="section-header">
      <div class="header-left">
        <h2 class="title">My rides</h2>
        <p class="subtitle">Good plans are better when shared</p>
      </div>
      <a class="browse-link" onclick={handleBrowseRides}>
        <span>Browse rides</span>
        <span class="arrow-symbol">→</span>
      </a>
    </div>

    <template if:true={isLoading}>
      <div class="spinner-container">
        <lightning-spinner
          alternative-text="Loading upcoming rides"
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <template if:true={error}>
      <div class="error-container">
        <p class="error-text">
          Failed to load your rides. Please try again later.
        </p>
      </div>
    </template>

    <template if:false={isLoading}>
      <template if:true={hasRides}>
        <div class="table-card">
          <table class="custom-table">
            <thead>
              <tr>
                <th class="col-ride">RIDE</th>
                <th class="col-group">GROUP</th>
                <th class="col-dates">DATES</th>
                <th class="col-status">STATUS</th>
                <!--th class="col-action">ACTION</th-->
              </tr>
            </thead>
            <tbody>
              <template for:each={formattedRides} for:item="ride">
                <tr key={ride.participantId}>
                  <td class="col-ride">
                    <div class="ride-cell">
                      <div class={ride.badgeClass}>
                        <span>{ride.badgeIndex}</span>
                      </div>
                      <div class="ride-info">
                        <span class="ride-name">{ride.rideName}</span>
                        <template if:true={ride.description}>
                          <span class="ride-description"
                            >{ride.description}</span
                          >
                        </template>
                      </div>
                    </div>
                  </td>
                  <td class="col-group">
                    <span class="group-name">{ride.ridingGroupName}</span>
                  </td>
                  <td class="col-dates">
                    <span class="dates-text">{ride.formattedDates}</span>
                  </td>
                  <td class="col-status">
                    <span class={ride.statusPillClass}>
                      <span class="status-dot"></span>
                      {ride.rideStatus}
                    </span>
                  </td>
                  <!--td class="col-action">
                                        <button class="join-btn" data-id={ride.rideId} onclick={handleJoinRide}>
                                            Join ride
                                        </button>
                                    </td-->
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>

      <template if:false={hasRides}>
        <template if:false={error}>
          <div class="empty-state">
            <lightning-icon
              icon-name="utility:date_time"
              size="large"
              alternative-text="No Upcoming Rides"
            ></lightning-icon>
            <p class="empty-title">You haven't participated in any rides yet</p>
            <p class="empty-subtitle">
              Explore available upcoming rides to join and take part.
            </p>
          </div>
        </template>
      </template>
    </template>
  </div>
</template>
