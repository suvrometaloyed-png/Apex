<template>
    <!-- Ongoing Rides Section -->
    <div class="rides-container">
        <div class="section-header">
            <div class="header-left">
                <h2 class="title">Ongoing Rides</h2>
                <p class="subtitle">View and explore all ongoing rides</p>
            </div>
        </div>

        <template if:true={isOngoingLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading ongoing rides" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={ongoingError}>
            <div class="error-container">
                <p class="error-text">Failed to load ongoing rides. Please try again later.</p>
            </div>
        </template>

        <template if:false={isOngoingLoading}>
            <template if:true={hasOngoingRides}>
                <div class="table-card">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="col-ride">RIDE</th>
                                <th class="col-group">GROUP</th>
                                <th class="col-dates">DATES</th>
                                <th class="col-status">STATUS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={formattedOngoingRides} for:item="ride">
                                <tr key={ride.id}>
                                    <td class="col-ride">
                                        <div class="ride-cell">
                                            <div class={ride.badgeClass}>
                                                <span>{ride.badgeIndex}</span>
                                            </div>
                                            <div class="ride-info">
                                                <span class="ride-name">{ride.name}</span>
                                                <template if:true={ride.description}>
                                                    <span class="ride-description">{ride.description}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-group">
                                        <span class="group-name">{ride.ridingGroupName}</span>
                                    </td>
                                    <td class="col-dates">
                                        <span class="dates-text">{ride.formattedDates}</span>
                                    </td>
                                    <td class="col-status">
                                        <span class={ride.statusPillClass}>
                                            <span class="status-dot"></span>
                                            {ride.status}
                                        </span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasOngoingRides}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:event" size="large" alternative-text="No Ongoing Rides"></lightning-icon>
                    <p class="empty-title">No ongoing rides found</p>
                    <p class="empty-subtitle">Check back later or check with your riding group for scheduled rides.</p>
                </div>
            </template>
        </template>
    </div>

    <!-- Completed Rides Section -->
    <div class="rides-container section-gap">
        <div class="section-header">
            <div class="header-left">
                <h2 class="title">Completed Rides</h2>
                <p class="subtitle">View and explore all completed rides</p>
            </div>
        </div>

        <template if:true={isCompletedLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading completed rides" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={completedError}>
            <div class="error-container">
                <p class="error-text">Failed to load completed rides. Please try again later.</p>
            </div>
        </template>

        <template if:false={isCompletedLoading}>
            <template if:true={hasCompletedRides}>
                <div class="table-card">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="col-ride">RIDE</th>
                                <th class="col-group">GROUP</th>
                                <th class="col-dates">DATES</th>
                                <th class="col-status">STATUS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={formattedCompletedRides} for:item="ride">
                                <tr key={ride.id}>
                                    <td class="col-ride">
                                        <div class="ride-cell">
                                            <div class={ride.badgeClass}>
                                                <span>{ride.badgeIndex}</span>
                                            </div>
                                            <div class="ride-info">
                                                <span class="ride-name">{ride.name}</span>
                                                <template if:true={ride.description}>
                                                    <span class="ride-description">{ride.description}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-group">
                                        <span class="group-name">{ride.ridingGroupName}</span>
                                    </td>
                                    <td class="col-dates">
                                        <span class="dates-text">{ride.formattedDates}</span>
                                    </td>
                                    <td class="col-status">
                                        <span class={ride.statusPillClass}>
                                            <span class="status-dot"></span>
                                            {ride.status}
                                        </span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasCompletedRides}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:event" size="large" alternative-text="No Completed Rides"></lightning-icon>
                    <p class="empty-title">No completed rides found</p>
                    <p class="empty-subtitle">Completed rides will appear here once finished.</p>
                </div>
            </template>
        </template>
    </div>
</template>
