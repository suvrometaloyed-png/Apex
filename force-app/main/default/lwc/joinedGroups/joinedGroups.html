<template>
    <div class="groups-container">
        <!-- Section Header -->
        <div class="section-header">
            <div class="header-left">
                <h2 class="title">Groups joined</h2>
                <p class="subtitle">Stay connected with your cycling communities</p>
            </div>
            <a class="browse-link" onclick={handleBrowseGroups}>
                <span>Browse groups</span>
                <span class="arrow-symbol">→</span>
            </a>
        </div>

        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading joined groups" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="error-container">
                <p class="error-text">Failed to load your groups. Please try again later.</p>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasGroups}>
                <div class="table-card">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="col-group">GROUP</th>
                                <th class="col-date">JOINED ON</th>
                                <th class="col-members">MEMBERS</th>
                                <th class="col-status">STATUS</th>
                                <!--th class="col-action">ACTION</th-->
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={formattedGroups} for:item="grp">
                                <tr key={grp.id}>
                                    <td class="col-group">
                                        <div class="group-cell">
                                            <div class={grp.badgeClass}>
                                                <span>{grp.badgeIndex}</span>
                                            </div>
                                            <div class="group-info">
                                                <span class="group-name">{grp.name}</span>
                                                <template if:true={grp.description}>
                                                    <span class="group-description">{grp.description}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-date">
                                        <span class="date-text">{grp.formattedDate}</span>
                                    </td>
                                    <td class="col-members">
                                        <span class="members-text">{grp.memberCount} members</span>
                                    </td>
                                    <td class="col-status">
                                        <span class={grp.statusPillClass}>
                                            <span class="status-dot"></span>
                                            {grp.membershipStatus}
                                        </span>
                                    </td>
                                    <!--td class="col-action">
                                        <button class="view-btn" data-id={grp.id} onclick={handleViewGroup}>
                                            View group
                                        </button>
                                    </td-->
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasGroups}>
                <template if:false={error}>
                    <div class="empty-state">
                        <lightning-icon icon-name="utility:groups" size="large" alternative-text="No Groups"></lightning-icon>
                        <p class="empty-title">You haven't joined any groups yet</p>
                        <p class="empty-subtitle">Visit the Groups page to find and join a riding group.</p>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
