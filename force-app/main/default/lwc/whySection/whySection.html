<template>

<section class="section">

    <div class="container">

        <div class="heading">

            <h2>Why ApeX Exists</h2>

            <p>
                Building safer, fairer and stronger riding communities.
            </p>

        </div>

        <div class="grid">

            <template

                <c-feature-card

                    icon={feature.icon}

                    title={feature.title}

                    description={feature.description}>

                </c-feature-card>

            </template>

        </div>

    </div>

</section>

</template>
