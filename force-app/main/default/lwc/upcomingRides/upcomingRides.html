<template>
    <div class="rides-container">
        <div class="header-section">
            <h2 class="title">Upcoming Rides</h2>
            <p class="subtitle">View and explore all scheduled upcoming rides</p>
        </div>

        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading upcoming rides" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="error-container">
                <p class="error-text">Failed to load upcoming rides. Please try again later.</p>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasRides}>
                <div class="table-card">
                    <lightning-datatable
                        key-field="id"
                        data={rides}
                        columns={columns}
                        hide-checkbox-column="true"
                        show-row-number-column="true"
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>

            <template if:false={hasRides}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:event" size="large" alternative-text="No Rides"></lightning-icon>
                    <p class="empty-title">No upcoming rides found</p>
                    <p class="empty-subtitle">Check back later or check with your riding group for scheduled rides.</p>
                </div>
            </template>
        </template>

        <!-- Flow Modal -->
        <template if:true={isFlowOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={closeFlowModal}>
                        </lightning-button-icon>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Join Ride - {selectedRideName}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow
                            flow-api-name="Join_Ride"
                            flow-input-variables={flowInputVariables}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
