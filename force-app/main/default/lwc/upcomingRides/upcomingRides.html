<template>
    <div class="rides-container">
        <!-- Section Header -->
        <div class="section-header">
            <div class="header-left">
                <h2 class="title">Upcoming Rides</h2>
                <p class="subtitle">View and explore all scheduled upcoming rides</p>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading upcoming rides" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="error-container">
                <p class="error-text">Failed to load upcoming rides. Please try again later.</p>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasRides}>
                <div class="table-card">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="col-ride">RIDE</th>
                                <th class="col-group">GROUP</th>
                                <th class="col-dates">DATES</th>
                                <th class="col-status">STATUS</th>
                                <th class="col-action">ACTION</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={formattedRides} for:item="ride">
                                <tr key={ride.id}>
                                    <td class="col-ride">
                                        <div class="ride-cell">
                                            <div class={ride.badgeClass}>
                                                <span>{ride.badgeIndex}</span>
                                            </div>
                                            <div class="ride-info">
                                                <span class="ride-name">{ride.name}</span>
                                                <template if:true={ride.description}>
                                                    <span class="ride-description">{ride.description}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="col-group">
                                        <span class="group-name">{ride.ridingGroupName}</span>
                                    </td>
                                    <td class="col-dates">
                                        <span class="dates-text">{ride.formattedDates}</span>
                                    </td>
                                    <td class="col-status">
                                        <span class={ride.statusPillClass}>
                                            <span class="status-dot"></span>
                                            {ride.status}
                                        </span>
                                    </td>
                                    <td class="col-action">
                                        <button class="join-btn" data-id={ride.id} data-name={ride.name} onclick={handleJoinClick}>
                                            Join ride
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasRides}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:event" size="large" alternative-text="No Rides"></lightning-icon>
                    <p class="empty-title">No upcoming rides found</p>
                    <p class="empty-subtitle">Check back later or check with your riding group for scheduled rides.</p>
                </div>
            </template>
        </template>

        <!-- Flow Modal -->
        <template if:true={isFlowOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={closeFlowModal}>
                        </lightning-button-icon>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Join Ride - {selectedRideName}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow
                            flow-api-name="Join_Ride"
                            flow-input-variables={flowInputVariables}
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
