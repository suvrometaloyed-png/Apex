<template>

<lightning-spinner
    if:true={loading}>
</lightning-spinner>

<div class="grid">

    <template
        for:each={groups}

        <c-group-card

            group={group}

            onjoin={forwardJoin}

            onviewmembers={forwardMembers}>

        </c-group-card>

    </template>

</div>

</template>
