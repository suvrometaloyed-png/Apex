<template>

    <section class="groups-container">

        <!-- Header -->
        <div class="groups-header">

            <div>
                <h1 class="groups-title">
                    Riding Groups
                </h1>

                <p class="groups-subtitle">
                    Find riders, join a group and ride together.
                </p>
            </div>

            <div class="group-count">
                {filteredGroups.length} Groups
            </div>

        </div>


        <!-- Search -->
        <div class="search-container">

            <lightning-input
                type="search"
                label="Search groups"
                variant="label-hidden"
                placeholder="Search by group name or location..."
                value={searchTerm}
                onchange={handleSearch}>
            </lightning-input>

        </div>


        <!-- Loading -->
        <template if:true={isLoading}>

            <div class="loading-container">

                <lightning-spinner
                    alternative-text="Loading groups"
                    size="medium">
                </lightning-spinner>

            </div>

        </template>


        <!-- Error -->
        <template if:true={errorMessage}>

            <div class="error-container">

                <lightning-icon
                    icon-name="utility:error"
                    size="small"
                    alternative-text="Error">
                </lightning-icon>

                <span>{errorMessage}</span>

                <button
                    class="retry-button"
                    onclick={handleRetry}>
                    Retry
                </button>

            </div>

        </template>


        <!-- Groups -->
        <template if:false={isLoading}>

            <template if:true={hasGroups}>

                <div class="groups-grid">

                    <template
                        for:each={filteredGroups}
                        for:item="group">

                        <c-group-card
                            key={group.id}
                            group={group}
                            onjoingroup={handleJoinGroup}
                            onviewdetails={handleViewDetails}>
                        </c-group-card>

                    </template>

                </div>

            </template>


            <!-- No Search Results -->
            <template if:false={hasGroups}>

                <div class="empty-state">

                    <lightning-icon
                        icon-name="utility:groups"
                        size="large"
                        alternative-text="No groups">
                    </lightning-icon>

                    <h2>No groups found</h2>

                    <p>
                        Try changing your search criteria.
                    </p>

                    <template if:true={searchTerm}>
                        <button
                            class="clear-button"
                            onclick={clearSearch}>
                            Clear Search
                        </button>
                    </template>

                </div>

            </template>

        </template>

        <!-- Group Details -->
        <template lwc:if={selectedGroup}>
            <c-group-details-modal
                group={selectedGroup}
                onclose={handleCloseDetails}>
            </c-group-details-modal>
        </template>

    </section>

</template>
